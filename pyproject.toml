[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groove-rsi"
version = "0.1.0"
description = "A groovy RSI framework."
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6,<7"]
local = ["openai>=1.0,<3", "PyYAML>=6,<7"]
claude = ["claude-agent-sdk>=0.1", "PyYAML>=6,<7"]
models = ["PyYAML>=6,<7", "openai>=1.0,<3", "claude-agent-sdk>=0.1"]

[project.scripts]
groove = "groove.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
groove = ["role_prompts/*.md"]
